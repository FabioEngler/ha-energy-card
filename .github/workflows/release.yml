name: Build and release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-24.04
    container: mcr.microsoft.com/playwright:v1.64.1-noble
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Verify release version
        if: startsWith(github.ref, 'refs/tags/')
        run: node -e "const p = require('./package.json'); if (process.env.GITHUB_REF_NAME !== 'v' + p.version) throw new Error('Tag must match package.json version');"
      - run: npm ci
      - run: npm test
      - run: npm run build
      - name: Verify committed HACS bundle
        run: git diff --exit-code -- dist/ha-energy-card.js
      - run: npm run test:browser
      - uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: dist/ha-energy-card.js
          fail_on_unmatched_files: true
          generate_release_notes: true
