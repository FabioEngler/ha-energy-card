name: Checks
on:
  push:
    branches: ['**']
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - name: Verify committed HACS bundle
        run: git diff --exit-code -- dist/ha-energy-card.js
      - run: npx playwright install --with-deps chromium webkit
      - run: npm run test:browser
